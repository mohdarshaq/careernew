<script>
/* ===================== DATA ===================== */
const CATS=[
{id:'ai',n:'AI & Machine Learning'},{id:'data',n:'Data & Business Analytics'},{id:'sw',n:'Software Development'},{id:'web',n:'Web Development & MERN'},
{id:'cyber',n:'Cybersecurity'},{id:'cloud',n:'Cloud & DevOps'},{id:'ux',n:'UI/UX Design'},{id:'graphic',n:'Graphic Design'},

{id:'eng',n:'Engineering'},{id:'edu',n:'Education'},{id:'govt',n:'Government & Public Sector'},{id:'creative',n:'Creative Industries'},
{id:'ent',n:'Entrepreneurship'},{id:'other',n:'Other emerging & traditional fields'}];
const catName=id=>(CATS.find(c=>c.id===id)||{n:id}).n;

,{id:"mbbs",name:"Doctor (MBBS)",cat:'health',qual:'12',degree:"mandatory",months:[66, 84],budget:"high",online:false,tags:["people", "learn", "logic", "public"],short:"Diagnose and treat patients as a licensed medical doctor, after the MBBS degree.",overview:"MBBS doctors examine patients, find the cause of illness, prescribe treatment and refer to specialists. After MBBS, many doctors specialise (for example with a postgraduate degree) or work in hospitals, clinics, public health and research.",meaning:"MBBS is a long, regulated degree. Students must qualify in the national entrance exam (NEET-UG) to get admission to recognised medical colleges in India.",daily:["See and examine patients", "Order and interpret tests", "Prescribe treatment and explain it to patients", "Work in teams with nurses and other clinicians", "Keep medical records and follow ethics rules"],titles:["Medical Officer", "Junior Resident", "Resident Doctor", "Consultant (after specialisation)"],quals:"Plus Two with Physics, Chemistry and Biology (or Biotechnology) is the usual route, plus a qualifying score in NEET-UG. MBBS is commonly described as about 5.5 years including a compulsory internship. Check the exact eligibility, marks and age rules with NMC and NTA.",degreeText:"A recognised medical degree and registration with the relevant medical council are required to practise as a doctor. There is no legitimate shortcut without the degree.",nodegree:"Not applicable for becoming a doctor. If you do not get a medical seat, related paths exist, such as nursing, pharmacy, physiotherapy, laboratory technology, public health or biomedical fields. Check each one's own rules.",tech:["Anatomy, physiology, biochemistry", "Pathology and pharmacology", "Clinical examination", "Diagnosis and treatment planning", "Medical ethics"],soft:["Empathy", "Communication with patients", "Calm under pressure", "Teamwork", "Long-term discipline"],tools:["Stethoscope and clinical instruments", "Hospital information systems", "Medical journals and guidelines"],learn:[{"t": "National Medical Commission (official)", "u": "https://www.nmc.org.in/"}, {"t": "NEET-UG information (NTA)", "u": "https://neet.nta.nic.in/"}, {"t": "Kerala University of Health Sciences", "u": "https://kuhs.ac.in/"}],eligibility:"Set by NMC, NTA and the state or college admission authority. Admission rules, seat numbers, fees and exam patterns change; confirm everything on the official NMC, NTA and state admission websites before applying.",entry:["House surgeon / intern (during the course)", "Medical officer posts after registration"],market:"Doctors are needed in hospitals, clinics and public health, but competition for medical seats and postgraduate seats is high. We have not verified current numbers.",india:"Public and private hospitals across India. Government posts are filled through official recruitment.",abroad:"Practising abroad usually needs separate licensing exams and recognition of your degree in that country. Check each country's rules.",growth:["Intern", "Resident", "Specialist or senior doctor", "Head of department / hospital leadership"],freelance:"Some doctors run their own clinics; teleconsultation exists but is regulated.",future:"Healthcare demand continues, and technology (including AI) is changing diagnosis support and paperwork. Exact effects are uncertain.",auto:["Drafting notes and summaries", "Flagging patterns in scans or tests for review", "Routine paperwork"],human:["Clinical judgment", "Talking with and comforting patients", "Ethical decisions", "Taking responsibility for care"],pros:["Meaningful work with people", "Respected profession", "Many specialisation options"],cons:["Very long training", "Demanding hours", "High competition and cost pressure"],challenges:["Cost and competition for seats", "Long study before earning", "Emotional pressure"],difficulty:"Very high. Needs years of sustained study and strong commitment.",roadmap:[{"p": "NEET-UG preparation", "h": 700, "items": ["Strengthen Plus Two Physics, Chemistry and Biology", "Study the official NEET syllabus from NTA", "Take timed mock tests weekly"]}, {"p": "Admission process", "h": 30, "items": ["Check eligibility, dates and counselling steps on official sites", "Prepare documents and a budget plan"]}, {"p": "Medical studies", "h": 0, "items": ["Follow your college curriculum", "Complete the internship as required by NMC"]}, {"p": "After MBBS", "h": 0, "items": ["Choose between practice, postgraduate study or public health", "Register with the medical council"]}],projects:["Volunteer at a first-aid or health camp", "Shadow or talk with a doctor (with permission)"],prep:["Keep your Plus Two Biology strong"],interview:["Why do you want to become a doctor?", "How would you handle a patient who is afraid of treatment?", "Describe a time you worked under pressure."],alts:["nursing", "pharm", "physio"],faq:[{"q": "Is NEET compulsory?", "a": "For MBBS admission in India, a qualifying NEET-UG score is required. Check the latest rules with NTA and NMC."}, {"q": "Are there other medical options?", "a": "Yes: nursing, pharmacy, physiotherapy, lab technology, Ayurveda and more. They have different routes."}],sources:[{t:'National Medical Commission (NMC)',u:'https://www.nmc.org.in/'},SRC.ncs]},
{id:"nursing",name:"Nurse (B.Sc Nursing / GNM)",cat:'health',qual:'12',degree:"mandatory",months:[36, 48],budget:"mid",online:false,tags:["people", "public", "learn"],short:"Care for patients, support doctors and promote health in hospitals and communities.",overview:"Nurses assess patients, give care and medicines as directed, monitor recovery and teach families. Nursing can lead to specialisation, teaching, public health and leadership roles.",meaning:"Nursing is a regulated profession. Nurses must complete a recognised course and register with the relevant nursing council to practise.",daily:["Monitor patients and record vital signs", "Give medicines and treatments as prescribed", "Help with procedures and emergencies", "Teach patients and families about care", "Coordinate with doctors and other staff"],titles:["Staff Nurse", "Staff Nurse (ICU/OT)", "Community Health Nurse", "Nursing Educator"],quals:"Common routes are B.Sc Nursing (about 4 years) and GNM diploma (about 3 years), usually after Plus Two with Science including Biology and English. Admission routes and entrance requirements differ by state and institution. Verify with the Indian Nursing Council and your state admission authority.",degreeText:"A recognised nursing qualification and registration with the nursing council are required to practise as a nurse.",nodegree:"Not applicable for a registered nurse. Healthcare support roles with shorter courses exist, but they are different from nursing; check each role's requirements.",tech:["Patient care", "Medication safety", "Infection control", "Basic emergency care", "Record keeping"],soft:["Compassion", "Communication", "Stamina", "Teamwork", "Attention to detail"],tools:["Patient monitoring equipment", "Hospital record systems"],learn:[{"t": "Indian Nursing Council (official)", "u": "https://indiannursingcouncil.org/"}, {"t": "Kerala University of Health Sciences", "u": "https://kuhs.ac.in/"}],eligibility:"Set by INC, universities and state authorities. const SECS=[
{id:'int',n:'Interests',c:'#9B7CFF',d:'What kinds of work you enjoy'},
{id:'log',n:'Logical reasoning',c:'#4C8DFF',d:'Four short practice puzzles'},
{id:'prob',n:'Problem-solving',c:'#2CC4A8',d:'How you tackle real situations'},

const TAGN={build:'building things',logic:'logic and reasoning',data:'working with data',design:'design and visuals',people:'working with people',secure:'security and protection',business:'business and money',public:'stability and public service',write:'writing and content',learn:'continuous learning'};
const LK=['Not me','A little','Mostly','Very much'];
const AQ=[
{s:'int',k:'l',q:'I enjoy building or fixing things step by step.',tag:'build'},

{s:'int',k:'l',q:'I am curious about how systems can be attacked or protected.',tag:'secure'},
{s:'int',k:'l',q:'I enjoy planning budgets, money or how a business runs.',tag:'business'},
{s:'int',k:'l',q:'I would value a role where I serve the public.',tag:'public'},
{s:'int',k:'l',q:'I enjoy learning new tools and topics regularly.',tag:'learn'},
{s:'log',k:'m',a:2,q:'What comes next in this series? 2, 6, 12, 20, 30, ...',o:['38','40','42','44']},
{s:'log',k:'m',a:0,q:'All coders in the club know Git. Meena is in the club and is a coder. What follows?',o:['Meena knows Git','Meena teaches Git','Meena dislikes Git','Nothing can be said']},
{s:'log',k:'m',a:3,q:'Which one does not belong with the others?',o:['Square','Rectangle','Triangle','Cube']},
{s:'log',k:'m',a:1,q:'A task takes 3 people 6 days. At the same pace, how long would 6 people need?',o:['2 days','3 days','4 days','12 days']},
{s:'prob',k:'m',q:'Your phone app suddenly stops working. What do you do first?',o:[{l:'Check what changed recently and test one thing at a time',w:{logic:2,build:1}},{l:'Search online for others with the same problem',w:{learn:2,data:1}},{l:'Ask a friend who knows phones well',w:{people:2}},{l:'Look for the official instructions and follow the rules',w:{public:2}}]},
{s:'prob',k:'m',q:'A club event had low turnout. What do you try?',o:[{l:'Look at who came and who did not, and find patterns',w:{data:2,business:1}},{l:'Redesign the poster and invitation messages',w:{design:2,write:1}},{l:'Talk to members and ask them directly',w:{people:2}},{l:'Make a budget and schedule for the next event',w:{business:2,public:1}}]},
{s:'prob',k:'m',q:'You meet a puzzle you cannot solve. You...',o:[{l:'Keep trying different approaches until it works',w:{logic:2,build:1}},{l:'Break it into smaller parts and write each down',w:{logic:1,data:1,write:1}},{l:'Learn the technique from a tutorial, then try again',w:{learn:2}},{l:'Work on it together with someone else',w:{people:2}}]},
{s:'prob',k:'m',q:'Your group must finish a project in one week. Which role feels most natural?',o:[{l:'Building the main product or solution',w:{build:2,logic:1}},{l:'Checking quality and finding mistakes',w:{secure:1,data:1,public:1}},{l:'Presenting and coordinating the team',w:{people:2,business:1}},{l:'Designing how it looks and feels',w:{design:2}}]},
{s:'cre',k:'l',q:'I enjoy drawing, designing or making things look good.',tag:'design'},
{s:'cre',k:'l',q:'I like inventing new ideas or different ways of doing things.',tag:'build'},
{s:'cre',k:'l',q:'I enjoy writing, storytelling or making content.',tag:'write'},
{s:'com',k:'l',q:'I like explaining ideas so that others understand them.',tag:'people'},
{s:'com',k:'l',q:'I am comfortable speaking in front of a group.',tag:'people'},
{s:'com',k:'l',q:'I enjoy persuading or convincing people.',tag:'business'},
{s:'work',k:'m',ck:'style',q:'Which work setting sounds best?',o:[{l:'Focused work, mostly on my own',w:{logic:1,build:1,data:1},c:'solo'},{l:'Working closely with a team',w:{people:2},c:'team'},{l:'A mix of both',w:{},c:'mix'}]},
{s:'work',k:'m',q:'What matters most to you in a job?',o:[{l:'Stability and clear rules',w:{public:2}},{l:'Fast growth and new challenges',w:{business:1,learn:1}},{l:'Creative freedom',w:{design:1,write:1}},{l:'Helping people solve problems',w:{people:2}}]},
{s:'work',k:'m',ck:'learn',q:'How do you learn best?',o:[{l:'Watching videos',w:{},c:'videos'},{l:'Reading and notes',w:{write:1},c:'reading'},{l:'Hands-on projects',w:{build:1},c:'projects'}]},
{s:'work',k:'m',ck:'goal',q:'Right now, your main goal is...',o:[{l:'Get a job as soon as possible',w:{},c:'job'},{l:'Complete a degree first',w:{public:1},c:'degree'},{l:'Explore and decide later',w:{learn:1},c:'explore'}]}
];
let APT={mode:'intro',i:0};
const aAns=()=>store.get('aptAns',{});
function aPts(q,v){const o={};if(q.k==='l')o[q.tag]=v-1;else if(q.a!==undefined){if(v===q.a)o.logic=3}else Object.entries(q.o[v].w||{}).forEach(([t,p])=>{o[t]=p});return o}
function aMax(q){const o={};if(q.k==='l')o[q.tag]=3;else if(q.a!==undefined)o.logic=3;else q.o.forEach(op=>Object.entries(op.w||{}).forEach(([t,p])=>{o[t]=Math.max(o[t]||0,p)}));return o}
function aScore(ans){const g={},m={};AQ.forEach((q,i)=>{if(ans[i]===undefined)return;const p=aPts(q,ans[i]),x=aMax(q);Object.keys(x).forEach(t=>{m[t]=(m[t]||0)+x[t];g[t]=(g[t]||0)+(p[t]||0)})});const r={};Object.keys(m).forEach(t=>{if(m[t]>0)r[t]=g[t]/m[t]});return r}
function aReason(ans){let n=0,ok=0;AQ.forEach((q,i)=>{if(q.a!==undefined&&ans[i]!==undefined){n++;if(ans[i]===q.a)ok++}});return {n,ok}}
function aWhy(c,ans){const L=[];AQ.forEach((q,i)=>{if(ans[i]===undefined||q.a!==undefined)return;const p=aPts(q,ans[i]),m=aMax(q);let best=0;(c.tags||[]).forEach(t=>{if(m[t]&&p[t])best=Math.max(best,p[t]/m[t])});if(best>=0.66){const sec=SECS.find(x=>x.id===q.s).n;L.push([best,q.k==='l'?sec+': "'+q.q+'" (you said: '+LK[ans[i]-1]+')':sec+': "'+q.q+'" (you chose: '+q.o[ans[i]].l+')'])}});L.sort((a,b)=>b[0]-a[0]);const out=L.slice(0,3).map(x=>x[1]);if((c.tags||[]).includes('logic')){const r=aReason(ans);if(r.n)out.push('Logical reasoning: you answered '+r.ok+' of '+r.n+' practice puzzles correctly. This is a tiny sample and not a measure of ability.')}return out}
VIEWS.assess=()=>'<div class="wrap" style="padding-top:20px;padding-bottom:20px"><div id="aroot"></div></div>';
AFTER.assess=()=>renderApt();
function renderApt(focus){const r=$('#aroot');if(!r)return;const res=store.get('assess',null);
 if(APT.mode==='result'&&res)r.innerHTML=aResult(res);else if(APT.mode==='quiz')r.innerHTML=aQuiz();else{APT.mode='intro';r.innerHTML=aIntro(res)}

async function sendMsg(text){
  if(!AI||STREAMING||!text.trim())return;
  if(!CHAT)newChat();
  CHAT.msgs.push({role:'user',content:text.trim()});if(CHAT.title==='New conversation')CHAT.title=text.trim().slice(0,48);
  const a={role:'assistant',content:''};CHAT.msgs.push(a);STREAMING=true;drawMsgs();toggleBusy(true);
  const hist=CHAT.msgs.slice(0,-1).slice(-14).map(x=>({role:x.role==='user'?'user':'assistant',content:x.content}));
  hist[0]={role:'user',content:sysPrompt()+'\n\nSTUDENT CONVERSATION BEGINS:\n\n'+hist[0].content};
  if(hist[0].role!=='user'){}
  CTRL=new AbortController();
  try{const r=await AI(hist,{onText:({text})=>{a.content=text;const el=$('#msgs');if(el){const last=el.lastElementChild;if(last&&last.classList.contains('ai')){last.innerHTML=md(text)}el.scrollTop=el.scrollHeight}},signal:CTRL.signal,cache:false});a.content=r.text||a.content}
  catch(e){a.error=ERR[e&&e.code]||'Something went wrong. Please try again.';if(e&&e.text&&!a.content)a.content=e.text;if(!a.content)a.content='I could not answer that.'}
  STREAMING=false;toggleBusy(false);saveChat();drawMsgs()}

  if(t.dataset&&t.dataset.act==='rmchk'){const rm=store.get('roadmap',null);rm.done=rm.done||{};rm.done[t.dataset.v]=t.checked;store.set('roadmap',rm);route(true);toast(t.checked?'Step completed':'Step unchecked')}});
document.addEventListener('submit',async e=>{const f=e.target;
  if(f.id==='rform'){e.preventDefault();const fd=new FormData(f);if(!fd.get('cid')){toast('Choose a career first');return}const old=store.get('roadmap',null);const same=old&&old.cid===fd.get('cid');store.set('roadmap',{cid:fd.get('cid'),hrs:+fd.get('hrs'),exp:fd.get('exp'),bud:fd.get('bud'),done:same?old.done:{}});location.hash='#/roadmap/'+fd.get('cid');route(true);toast('Roadmap ready')}
  if(f.id==='aform2'){e.preventDefault();const fd=new FormData(f);const t=ADM.type;const o={};AF[t].forEach(([k,l,ty])=>{let v=(fd.get(k)||'').toString().trim();if(ty==='csv')v=v?v.split(',').map(x=>x.trim()).filter(Boolean):[];o[k]=v});const nm=o.name||o.title;if(!nm){toast('Name is required');return}
    if(o.verified===''||o.verified==null)delete o.verified;if(t==='careers'){o.months=o.months||[0,0]}
    const id=ADM.edit==='new'?slug(nm):ADM.edit;o.id=id;
    try{if(t==='careers'&&ADM.edit==='new'){o.months=[0,0];o.qual='any';o.budget='low';o.online=true;o.tags=[]}await DB.collection(t).doc(id).set(o);await alog((ADM.edit==='new'?'Added ':'Updated ')+t.slice(0,-1)+': '+nm);ADM.edit=null;toast('Saved')}catch(x){toast('Could not save. Check you are signed in as the owner.')}}
});
window.addEventListener('DOMContentLoaded',()=>{});
route();initCaps();
</script>
